[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "app-review-intelligence-backend"
version = "0.1.0"
description = "Backend API for App Review Intelligence: environment-based configuration, database access, and health endpoints."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<3.3",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "pgvector>=0.3,<0.4",
    "httpx>=0.27,<0.28",
    "openai>=1.54,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a running PostgreSQL instance; skipped when unavailable",
]
